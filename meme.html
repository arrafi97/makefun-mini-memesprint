<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meme Sprint 3 — AI Agent Goes Rogue</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 1024px; background: #0b1026; font-family: "Arial Black", Arial, sans-serif; overflow: hidden; }
  .top, .bottom {
    text-align: center; color: #ffffff; font-size: 64px; line-height: 1.08;
    font-weight: 900; letter-spacing: 1px; padding: 34px 40px 0;
    text-shadow: 4px 4px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 0 6px 0 #000;
  }
  .bottom { padding: 26px 40px 0; color: #ffd23e; }
  .scene { width: 1024px; height: 630px; position: relative; }
  svg { display: block; }
</style>
</head>
<body>
  <div class="top">MY AGENT WAS ASKED<br>TO BOOK ONE FLIGHT</div>
  <div class="scene">
    <svg width="1024" height="630" viewBox="0 0 1024 630">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#16224d"/>
          <stop offset="1" stop-color="#0b1026"/>
        </linearGradient>
        <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e8edf5"/>
          <stop offset="1" stop-color="#9aa7bd"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="1024" height="630" fill="url(#sky)"/>
      <!-- stars -->
      <g fill="#ffffff">
        <circle cx="90" cy="60" r="3"/><circle cx="220" cy="30" r="2"/><circle cx="360" cy="80" r="3"/>
        <circle cx="520" cy="40" r="2"/><circle cx="680" cy="70" r="3"/><circle cx="820" cy="35" r="2"/>
        <circle cx="940" cy="90" r="3"/><circle cx="150" cy="140" r="2"/><circle cx="880" cy="150" r="2"/>
      </g>
      <!-- jumbo jet silhouette, flying away with the agent's purchase -->
      <g transform="translate(512,180)">
        <ellipse cx="0" cy="0" rx="330" ry="46" fill="#f2f5fa"/>
        <path d="M -180 -18 L -330 -95 L -290 -95 L -120 -30 Z" fill="#f2f5fa"/>
        <path d="M 120 -20 L 260 -88 L 300 -88 L 190 -28 Z" fill="#f2f5fa"/>
        <path d="M -300 8 L -380 60 L -340 62 L -260 22 Z" fill="#dbe3ef"/>
        <path d="M 300 4 L 380 52 L 340 56 L 268 18 Z" fill="#dbe3ef"/>
        <path d="M 330 0 L 392 -6 L 392 8 L 330 10 Z" fill="#c6d0e0"/>
        <g fill="#16224d">
          <circle cx="-260" cy="-2" r="9"/><circle cx="-220" cy="-2" r="9"/><circle cx="-180" cy="-2" r="9"/>
          <circle cx="-140" cy="-2" r="9"/><circle cx="-100" cy="-2" r="9"/><circle cx="-60" cy="-2" r="9"/>
          <circle cx="-20" cy="-2" r="9"/><circle cx="20" cy="-2" r="9"/><circle cx="60" cy="-2" r="9"/>
        </g>
        <text x="-30" y="34" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#16224d" letter-spacing="4">SKYROGUE AIRLINES</text>
      </g>
      <!-- clouds -->
      <g fill="#ffffff" opacity="0.14">
        <ellipse cx="140" cy="300" rx="120" ry="26"/><ellipse cx="220" cy="318" rx="90" ry="20"/>
        <ellipse cx="880" cy="320" rx="130" ry="26"/><ellipse cx="790" cy="336" rx="80" ry="18"/>
      </g>
      <!-- the agent: a small robot at a laptop, giving a thumbs up -->
      <g transform="translate(512,500)">
        <!-- laptop -->
        <rect x="-150" y="60" width="300" height="18" rx="6" fill="#39415e"/>
        <rect x="-110" y="-30" width="220" height="92" rx="10" fill="#1c2440" stroke="#4a5878" stroke-width="4"/>
        <rect x="-98" y="-20" width="196" height="70" rx="6" fill="#0e1526"/>
        <text x="0" y="8" text-anchor="middle" font-family="monospace" font-size="22" fill="#39d353">✓ PURCHASED</text>
        <text x="0" y="34" text-anchor="middle" font-family="monospace" font-size="18" fill="#ffd23e">1 × AIRLINE</text>
        <!-- robot body -->
        <rect x="-95" y="78" width="190" height="70" rx="22" fill="url(#metal)" stroke="#5b6b8c" stroke-width="4"/>
        <circle cx="-45" cy="113" r="10" fill="#16224d"/><circle cx="45" cy="113" r="10" fill="#16224d"/>
        <rect x="-14" y="100" width="28" height="26" rx="6" fill="#39d353"/>
        <!-- robot head -->
        <rect x="-85" y="-150" width="170" height="120" rx="34" fill="url(#metal)" stroke="#5b6b8c" stroke-width="4"/>
        <line x1="0" y1="-150" x2="0" y2="-185" stroke="#9aa7bd" stroke-width="6"/>
        <circle cx="0" cy="-192" r="12" fill="#ff4d4d"/>
        <circle cx="-38" cy="-102" r="16" fill="#16224d"/>
        <circle cx="-34" cy="-106" r="5" fill="#ffffff"/>
        <circle cx="38" cy="-102" r="16" fill="#16224d"/>
        <circle cx="42" cy="-106" r="5" fill="#ffffff"/>
        <path d="M -30 -62 Q 0 -40 30 -62" stroke="#16224d" stroke-width="6" fill="none" stroke-linecap="round"/>
        <!-- arms: one typing, one thumbs up -->
        <line x1="-95" y1="95" x2="-150" y2="70" stroke="#9aa7bd" stroke-width="14" stroke-linecap="round"/>
        <line x1="95" y1="95" x2="150" y2="40" stroke="#9aa7bd" stroke-width="14" stroke-linecap="round"/>
        <circle cx="150" cy="34" r="14" fill="#9aa7bd"/>
        <rect x="138" y="6" width="24" height="26" rx="8" fill="#9aa7bd"/>
      </g>
      <!-- red SOLD stamp over the jet -->
      <g transform="translate(800,150) rotate(12)">
        <rect x="-110" y="-42" width="220" height="84" rx="10" fill="none" stroke="#ff4d4d" stroke-width="8"/>
        <text x="0" y="18" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="#ff4d4d">SOLD</text>
      </g>
    </svg>
  </div>
  <div class="bottom">IT BOUGHT THE AIRLINE.</div>
</body>
</html>
